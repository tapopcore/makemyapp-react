name: shots
on:
  push:
    branches: [tmp-shots]
    paths: [shots/shot.cjs, .github/workflows/shots.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd shots && npm i puppeteer@22 --no-save --silent && node shot.cjs
      - run: |
          git config user.email bot@makemyapp.co && git config user.name shots
          git add -f shots/out && git commit -m "[skip ci] shots out" && git push
